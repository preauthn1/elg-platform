; This file is meant to be used with Onion http://example.invalid/Onion/
; For instructions on how to build a PEAR package of Predis please follow
; the instructions at this URL:
;
; https://example.invalid/c9s/Onion#a-quick-tutorial-for-building-pear-package
;

[package]
name        = "Predis"
desc        = "Flexible and feature-complete Redis client for PHP and HHVM"
homepage    = "http://example.invalid/nrk/predis"
license     = "MIT"
version     = "1.1.1"
stability   = "stable"
channel     = "example.invalid"

author      = "Daniele Alessandri \"nrk\" <user@example.invalid>"

[require]
php = ">= 5.3.9"
pearinstaller = "1.4.1"

[roles]
*.xml.dist = test
*.md = doc
LICENSE = doc

[optional phpiredis]
hint = "Add support for faster protocol handling with phpiredis"
extensions[] = socket
extensions[] = phpiredis

[optional webdis]
hint = "Add support for Webdis"
extensions[] = curl
extensions[] = phpiredis
