# ──────────────────────────────────────────────────────────────────────────
# build stage：DinD buildx build 單 image → push 到 Artifact Registry
# 移植自 apis/.gitlab-ci/build/build.yml，改為 Node 單 image。
#
# 產出 image：
#   ${AR_PATH}/${CI_PROJECT_PATH}:latest         （= .../target/gffv3/agent-backend:latest）
#   ${AR_PATH}/${CI_PROJECT_PATH}:<commit sha8>
#
# 需要的 CI/CD Variable：
#   GCR_RW_KEY_BASE64  — base64 GCP SA key（與 apis 共用），登入 AR push image
# ──────────────────────────────────────────────────────────────────────────
build:
  image: google/cloud-sdk:522.0.0
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG =~ /^release_\d+$/
      when: on_success
    - if: $CI_COMMIT_BRANCH == "cicd/stage-build"
      when: manual
  tags:
    # 沿用團隊既有的 DinD build runner（與 apis build job 同一組）
    - php8
  variables:
    DOCKER_HOST: tcp://localhost:2375
  services:
    - name: docker:18-dind
      command: [--mtu=1400]
  before_script:
    - docker info
    - docker buildx version
    - gcloud --version && docker --version
    # 將 gcr-key.json 存到臨時目錄避免被包含在 build image 中
    - mkdir -p /tmp/gcr
    - echo "${GCR_RW_KEY_BASE64}" | base64 -d > /tmp/gcr/gcr-key.json
    - gcloud auth activate-service-account --key-file /tmp/gcr/gcr-key.json
    - docker login -u _json_key --password-stdin https://asia-east1-docker.pkg.dev < /tmp/gcr/gcr-key.json
    - docker pull ${AR_PATH}/${CI_PROJECT_PATH}:latest || true
    - echo "IMAGE_NAME = ${AR_PATH}/${CI_PROJECT_PATH}"
    - echo "TAG_NAME   = ${CI_COMMIT_SHA:0:8}"
    - rm -rf /tmp/gcr
  script:
    # Pin BuildKit image：浮動 tag buildx-stable-1 自 v0.31.0 起內建 runc 1.3.6，
    # 其 masked paths tmpfs(nr_inodes=1) 遮蔽在 runner 主機舊 kernel(4.15) 上回 EINVAL，
    # 所有 RUN 步驟於 container init 即失敗（opencontainers/runc#5348）。
    # 待 BuildKit 綁上含 fallback 修復的 runc（>=1.5.1 或 1.3.7）後再改 pin 新版。
    - docker buildx create --name pinned-bk --driver docker-container --driver-opt image=moby/buildkit:v0.30.0 --use
    - >
      docker buildx build --platform linux/amd64 -f .gitlab-ci/build/Dockerfile -t ${AR_PATH}/${CI_PROJECT_PATH}:latest --cache-from ${AR_PATH}/${CI_PROJECT_PATH}:latest --build-arg BUILDKIT_INLINE_CACHE=1 --provenance=false --push .


    - docker pull ${AR_PATH}/${CI_PROJECT_PATH}:latest || true
    - docker tag ${AR_PATH}/${CI_PROJECT_PATH}:latest ${AR_PATH}/${CI_PROJECT_PATH}:${CI_COMMIT_SHA:0:8}
    - docker push ${AR_PATH}/${CI_PROJECT_PATH}:${CI_COMMIT_SHA:0:8}
