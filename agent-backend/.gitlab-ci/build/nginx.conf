# nginx：前端靜態 + /proxy 反代到同容器的 node gateway（0.0.0.0:3000）
# 以 scripts/deploy/nginx.conf 為底，加上 /proxy location。

worker_processes 1;

# graceful shutdown（entrypoint.sh 收到 SIGTERM 後送 SIGQUIT）的排空上限。
# 預設不設限，worker 會等到最後一個連線結束才退；一條慢連線就足以拖過
# terminationGracePeriodSeconds 而被 SIGKILL，反而把排空做白工。
# 本值須小於 entrypoint.sh 的輪詢上限 25s，讓 nginx 自己先收工、由輪詢自然結束，
# 而不是輪詢先逾時再由 exit 0 把殘留連線砍掉。詳細預算見 entrypoint.sh 註解。
worker_shutdown_timeout 20s;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  # mime.types 沒有 mjs，補上（避免 ESM 被當 octet-stream）；其餘副檔名沿用 mime.types，不重複定義
  types {
    application/javascript  mjs;
  }

  sendfile on;
  server_tokens off;

  server {
    listen 8080;
    server_name localhost;

    # always：404／50x 等錯誤回應也要帶
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 前端 /proxy/* 先打到這裡 → 反代到同容器的 node gateway（維護 server-side session、加密轉發）
    # 見 apps/gateway/README.md：prod 同源，前端與 gateway 經 nginx /proxy 串接
    location /proxy/ {
      proxy_pass http://0.0.0.0:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # target/tickets#4187：這裡是同 pod 內 nginx sidecar → node gateway 的
      # loopback 內部轉發，不是外部真實的一跳。用 $proxy_add_x_forwarded_for
      # 會把 nginx 自己的 $remote_addr 又追加一次，讓 gateway 收到的
      # X-Forwarded-For 比 GCLB 實際送出的多一節，把 resolveClientIp()
      # 信任鏈演算法原本預期「最後一格是 GCLB 自己的前端 VIP」的假設打亂
      # （改成原樣轉發，跟 apis/WEB_AgentBackend 的 PHP-FPM 架構看到的鏈一致）。
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # gateway 的 cs socket / ws 升級需求
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # SPA：靜態檔優先，找不到 fallback 到 index.html
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
