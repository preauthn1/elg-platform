<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<!--進來先讀英文版-->
<script>
const lang = navigator.language || navigator.userLanguage;
if (lang.includes("zh")) {
    location.href = "./cn";
}
else if (lang.includes("vi")) {
    location.href = "./vn";
}
else {
    location.href = "./en";
}
</script>
