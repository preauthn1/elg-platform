{{- $securityContext := .Values.securityContext }}
{{- $resources := .Values.resources }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "helm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: shared-files
          emptyDir: {}
        - name: {{ .Release.Name }}
          configMap:
            name: {{ .Release.Name }}
            items:
              {{- range $key, $val := .Values.configs.data }}
              - key: {{ $key }}
                path: {{ $key }}
              {{- end }}
      containers:
        - name: fluentd
          image: example.invalid/tp-wz3-rd/target/docker-base/fluentd-es:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
            - name: {{ .Release.Name }}
              mountPath: /etc/google-fluentd/google-fluentd.conf
              subPath: google-fluentd.conf
              readOnly: true
        - name: nginx
          image: nginx:1.16.1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
            - name: {{ .Release.Name }}
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
        - name: php
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
            - name: {{ .Release.Name }}
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp -r /app/. /var/www/html; cd /var/www/html; php artisan migrate; chmod -R 777 storage"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: socket
          image: example.invalid/tp-wz3-rd/target/docker-base/socket:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: {{ .Release.Name }}
              mountPath: /app/laravel-echo-server.json
              subPath: laravel-echo-server.json
              readOnly: true
          ports:
            - name: socket
              containerPort: 6001
              protocol: TCP
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
