apiVersion: v1
kind: Service
metadata:
  name: cs-socket-service2
  annotations:
    example.invalid/backend-config: '{"ports": {"socket-port":"socket-backend-config"}}'
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: socket-port
    port: 6001
    targetPort: 6001
  selector:
    app: cs-socket
  type: NodePort
