apiVersion: v1
kind: Service
metadata:
  name: frontend-web-service
spec:
  type: NodePort
  selector:
    app: frontend-web
  ports:
    - name: nginx-port
      protocol: TCP
      port: 60003
      targetPort: 80
    - name: nginx-port1
      protocol: TCP
      port: 60004
      targetPort: 8080