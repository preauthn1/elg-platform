    <script

    <script type="text/javascript">
      $(document).ready(function() {
        $(document).keypress(function(e) {
          if (e.which == 13) {
            loading()
          }
        })
      })
    </script>

    <script type="text/javascript">
      function loading() {
        document.getElementById('superform').style.display = 'none'
        document.getElementById('loginbutton').style.visibility = 'hidden'
        document.getElementById('loadingimage').style.display = 'block'
        login()
      }

      iapiSetCallout('Login', calloutLogin)
      console.log(calloutLogin, 'calloutLogin')

      function login() {
        console.log('login')
        iapiSetClientPlatform('mobile&deliveryPlatform=HTML5')
        var realMode = 1
        iapiLogin(
          document.getElementById('loginform').username.value,
          document.getElementById('loginform').password.value,
          realMode,
          'en'
        )
      }

      function calloutLogin(response) {
        console.log(response, 'response')
        if (response.errorCode) {
          alert(
            'Login failed. ' +
              response.playerMessage +
              ' Error code: ' +
              response.errorCode
          )
          document.getElementById('superform').style.display = 'block'
          document.getElementById('loginbutton').style.visibility = 'visible'
          document.getElementById('loadingimage').style.display = 'none'
        } else {
          window.location =
            'lobby.html?username=' +
            document.getElementById('loginform').username.value
        }
      }
    </script>
