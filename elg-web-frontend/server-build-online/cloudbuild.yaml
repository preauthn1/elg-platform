steps:
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:build || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build-online/Dockerfile-build -t example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:build --cache-from example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:build .
      docker push example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:build
      docker container create --name extract example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:build
      docker container cp extract:/src/dist ./dist/
      docker container rm -f extract
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build-online/Dockerfile-nginx -t example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:latest .
      docker tag example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:latest
      docker push example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:latest
- name: 'example.invalid/cloud-builders/kubectl'
  args:
  - set
  - image
  - deployment
  - frontend-web-deployment
  - frontend-nginx-container=example.invalid/$_PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA
  env:
  - 'CLOUDSDK_CORE_PROJECT=tp-wz3-online'
  - 'CLOUDSDK_COMPUTE_ZONE=asia-southeast1-a'
  - 'CLOUDSDK_CONTAINER_CLUSTER=xsgcasino-cluster'
substitutions:
  _PROJECT_ID: tp-wz3-online
  _NGINX_IMAGE_NAME: frontend-web-nginx-image