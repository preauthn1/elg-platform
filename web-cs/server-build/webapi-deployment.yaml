apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-web-deployment
spec:
  selector:
    matchLabels:
      app: cs-web
  replicas: 1
  template:
    metadata:
      labels:
        app: cs-web
    spec:      
      containers:
        - name: cs-web-nginx-container
          image: "example.invalid/tp-wz3-rd/cs-web-nginx-image:f02dacd"
          resources:
            requests:
              cpu: 50m
          ports:
            - containerPort: 80         