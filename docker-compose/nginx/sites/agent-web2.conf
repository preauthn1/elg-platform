server
{
    listen 80;
    listen [::]:80;

    server_name agent-web2.local;
    # 新代理後台前端專案：前端專案放在 WORKSPACE_PATH 下（容器內 /var/www/agent-backend）
    # 由 node24 跑 vite dev（pnpm dev:ele），此站只做反向代理，不落地靜態檔

    charset utf-8;

    location /
    {
        set $agent_web2_upstream node24:5777;
        proxy_pass http://$agent_web2_upstream;

        # vite 8 的 allowedHosts / ws Origin 檢查只認 localhost，故改寫這兩個 header
        proxy_set_header Host localhost:5777;
        proxy_set_header Origin http://localhost:5777;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600;
    }

    error_log /var/log/nginx/agent-web2_error.log;
    access_log /var/log/nginx/agent-web2_access.log;
}
