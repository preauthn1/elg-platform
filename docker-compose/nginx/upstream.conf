# 不再使用 upstream block。
# 原因：nginx 啟動時就解析 upstream 內的容器名稱並永久快取，
# php-fpm/php-fpm8 容器重啟換 IP 後不會重解析，會把請求送錯。
# 改在每個 vhost 用 `set $php_upstream "..."` + `fastcgi_pass $php_upstream`，
# 搭配 nginx.conf 的 `resolver 0.0.0.0`，每次請求都動態解析。

# ws upgrade（vite HMR 用，agent-web2 反代 node24 需要）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
