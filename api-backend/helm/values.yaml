    nginx.conf: |
      # For more information on configuration, see:
      #   * Official English Documentation: http://example.invalid/en/docs/
      #   * Official Russian Documentation: http://example.invalid/ru/docs/

      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log;
      pid /run/nginx.pid;
      # daemon off;

      # Load dynamic modules. See /usr/share/nginx/README.dynamic.
      include /usr/share/nginx/modules/*.conf;

      events {
          worker_connections 4096;
      }

      http {
          log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

          access_log  /var/log/nginx/access.log  main;

          sendfile            on;
          tcp_nopush          on;
          tcp_nodelay         on;
          keepalive_timeout   65;
          types_hash_max_size 2048;

          include             /etc/nginx/mime.types;
          default_type        application/octet-stream;

          # Load modular configuration files from the /etc/nginx/conf.d directory.
          # See http://example.invalid/en/docs/ngx_core_module.html#include
          # for more information.
          include /etc/nginx/conf.d/*.conf;

          server {
              listen       80 default_server;
              listen       [::]:80 default_server;
              server_name  _;
              root         /var/www/html/public;
              index        index.php;

              # if ($http_x_forwarded_proto = 'http') {
              #     rewrite ^ https://$host$request_uri? permanent;
              # }

              add_header X-Frame-Options "SAMEORIGIN";
              add_header X-XSS-Protection "1; mode=block";
              add_header X-Content-Type-Options "nosniff";

              # Load configuration files for the default server block.
              include /etc/nginx/default.d/*.conf;

              location / {
              try_files $uri $uri/ /index.php?$query_string;
              }
              location = /favicon.ico { access_log off; log_not_found off; }
              location = /robots.txt  { access_log off; log_not_found off; }
              error_page 404 /index.php;

              location ~* \.(pem|key) {
                  deny all;
                  return 403;
              }

              location ~ \.php$ {
                  fastcgi_pass   0.0.0.0:9000;
                  fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                  include        fastcgi_params;
              }

              error_page 404 /404.html;
                  location = /40x.html {
              }

              error_page 500 502 503 504 /50x.html;
                  location = /50x.html {
              }
          }
      }
    google-fluentd.conf: |
      <source>
        @type tail
        # Parse the timestamp, but still collect the entire line as 'message'
        # format /^\[(?<time>\d{4}-\d{1,2}-\d{1,2} \d{1,2}:\d{1,2}:\d{1,2})\] (?<env>[\w]+)\.(?<severity>[A-Z]+): (?<message>.*)/
        format json
        path /var/www/html/storage/logs/laravel-%Y-%m-%d.log
        # path /var/www/html/storage/logs/laravel.log
        pos_file /var/lib/google-fluentd/pos/laravel.pos
        tag laravel
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </source>
      # Master configuration file for google-fluentd

      # Include any configuration files in the config.d directory.
      #
      # An example "catch-all" configuration can be found at
      # https://example.invalid/GoogleCloudPlatform/fluentd-catch-all-config
      @include config.d/*.conf

      # Prometheus monitoring.
      #<source>
      #  @type prometheus
      #  port 24231
      #</source>
      #<source>
      #  @type prometheus_monitor
      #</source>
      <system>
        log_level trace
      </system>

      # Do not collect fluentd's own logs to avoid infinite loops.
      <match fluent.**>
        @type null
      </match>

      # Add a unique insertId to each log entry that doesn't already have it.
      # This helps guarantee the order and prevent log duplication.
      <filter **>
        @type add_insert_ids
      </filter>

      # Configure all sources to output to Google Cloud Logging
      <match **>
        @type elasticsearch
        logstash_format true
        type_name _doc
        include_tag_key true
        host efk-elasticsearch-client.default.svc.cluster.local
        port 9200

        buffer_type file
        buffer_path /var/log/google-fluentd/buffers
        buffer_chunk_limit 512KB
        # Flush logs every 5 seconds, even if the buffer is not full.
        flush_interval 5s
        # Enforce some limit on the number of retries.
        disable_retry_limit false
        # After 3 retries, a given chunk will be discarded.
        retry_limit 3
        # Wait 10 seconds before the first retry. The wait interval will be doubled on
        # each following retry (20s, 40s...) until it hits the retry limit.
        retry_wait 10
        max_retry_wait 300
        # Use multiple threads for processing.
        num_threads 8
        detect_json true

        request_timeout 2147483648
      </match>

