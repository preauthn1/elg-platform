<source>
  @type tail
  # Parse the timestamp, but still collect the entire line as 'message'
  # format /^\[(?<time>\d{4}-\d{1,2}-\d{1,2} \d{1,2}:\d{1,2}:\d{1,2})\] (?<env>[\w]+)\.(?<severity>[A-Z]+): (?<message>.*)/
  format json
  path /var/www/html/storage/logs/laravel-%Y-%m-%d.log
  # path /var/www/html/storage/logs/laravel.log
  pos_file /var/lib/google-fluentd/pos/laravel.pos
  read_from_head true
  tag laravel
  time_format %Y-%m-%dT%H:%M:%S.%NZ
</source>