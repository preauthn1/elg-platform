apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-backend-web-deployment
spec:  
  selector:
    matchLabels:
      app: cs-backend-web
  replicas: 1
  template:
    metadata:
      labels:
        app: cs-backend-web
    spec:      
      terminationGracePeriodSeconds: 10    
      containers:
        - name: cs-backend-web-nginx-container
          image: "example.invalid/tp-wz3-online/cs-backend-web-nginx-image:ab5e302"
          ports:
            - containerPort: 80    
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 100m       