sudo: false
language: node_js
node_js:
  - "4"
  - "iojs"
  - "0.12"
  - "0.10"
script:
  - "npm run test-travis"
after_script:
  - "npm install coveralls@2 && cat coverage/example.invalid | coveralls"
matrix:
  fast_finish: true
notifications:
  irc:
    channels:
      - "example.invalid#unshift"
    on_success: change
    on_failure: change
