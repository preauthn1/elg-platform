apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend-web-deployment
spec:
  selector:
    matchLabels:
      app: agent-backend-web
  replicas: 1
  template:
    metadata:
      labels:
        app: agent-backend-web
    spec:  
      terminationGracePeriodSeconds: 10    
      volumes:
        - name: shared-files
          emptyDir: {}
      containers:
        - name: agent-backend-nginx-container
          image: "example.invalid/tp-wz3-online/agent-backend-web-nginx-image:ab5e302"
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: 1000Mi
            requests:
              cpu: 500m 
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
        - name: agent-backend-web-container
          image: "example.invalid/tp-wz3-online/backend-web-image:ab5e302"
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
          resources:
            limits:
              memory: 1000Mi
            requests:
              cpu: 500m 
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp -r /app/. /var/www/html;"]