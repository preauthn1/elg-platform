apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: agent-backend-web-ingress
  annotations:
    example.invalid/ingress.global-static-ip-name: "agent-backend-static-ip"    
spec:
  tls:
    - secretName: everluckgames-ingress
    - secretName: xsgcasino-ingress
  rules:
  - host: example.invalid
    http:
      paths:
      - backend:
          serviceName: agent-backend-web-service
          servicePort: nginx-port
  - host: example.invalid
    http:
      paths:
      - backend:
          serviceName: agent-backend-web-service
          servicePort: nginx-port