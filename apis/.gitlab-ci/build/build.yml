release-prod:
  # 部署開始後不可被新 push 取消，半途中斷會留下部署到一半的環境
  interruptible: false
  image: alpine:3.12.12
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^release_\d+$/
      when: on_success
  # build 與 test 同屬 prepare stage 且無 needs 關係（兩者平行），只 needs build 時
  # 有 needs 的 job 會無視 stage 順序、需求一滿足即執行，等同測試紅了仍會把部署
  # trigger 打去 project 526。與 release-dev (latest) 對齊，補上 test / prepare。
  needs:
    - build
    - test
    - prepare
  variables:
    # 目標專案的 project access token
    PRIVATE_TOKEN: [REDACTED]
    # 目標專案的 pipeline trigger token
    REPO_ENV_TOKEN: [REDACTED]
    REPO_ENV_URL: http://example.invalid:1688/api/v4/projects/526/trigger/pipeline
  before_script:
    - echo ${REPO_ENV_URL}
    - echo ${CI_COMMIT_REF_NAME}
    - echo ${CI_COMMIT_TAG}
    - apk add --update --no-cache curl jq bash
  script:
    - json=$(curl -s --fail -X POST -F token=[REDACTED] -F ref=main -F variables[SRC_PROJECT]=${CI_PROJECT_PATH} -F variables[SRC_COMMIT_BRANCH]=${CI_COMMIT_BRANCH} -F variables[SRC_COMMIT_TAG]=${CI_COMMIT_TAG} -F variables[Message]=${CI_COMMIT_TITLE} -F variables[SRC_SHA]=${CI_COMMIT_SHA} -F variables[SRC_SHORT_SHA]=${CI_COMMIT_SHORT_SHA} ${REPO_ENV_URL})
    - echo $json
    - pipeline_id=$(echo $json | jq .id)
    - web_url=$(echo $json | jq .web_url)
    - echo "For production deployment, please visit $web_url to select your target environment"
  tags:
    - golang
  
