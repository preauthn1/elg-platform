lint:no-env:
  stage: lint
  image: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/target/docker-base/phpbase/8:latest
  tags:
    - php8
  script:
    - |
      bash << 'EOF'
      set -e

      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      NC='\033[0m'

      echo -e "${YELLOW}🔍 檢查 env() 禁用規則（禁止在 config/ 外使用 env()）...${NC}"
      echo ""

      # 掃描 app/ 與 routes/ 下所有 PHP 檔案
      # 使用 \benv( 排除 getenv()；排除以 // /* * # 開頭的純註解行
      VIOLATIONS=$(grep -rn --include="*.php" "\benv(" app/ routes/ 2>/dev/null | \
        grep -vE ":[0-9]+:[[:space:]]*(\/\/|\/\*|\*|#)" || true)

      if [ -n "$VIOLATIONS" ]; then
        echo -e "${RED}❌ 發現 env() 違規使用（應改用 config()）：${NC}"
        echo ""
        echo "$VIOLATIONS"
        echo ""
        echo -e "${RED}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
        echo -e "${RED}  禁止在 config/ 外使用 env()，請改用 config() 讀取  ${NC}"
        echo -e "${RED}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
        exit 1
      fi

      echo -e "${GREEN}✅ env() 禁用規則檢查通過${NC}"
      EOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
  allow_failure: false

lint:no-debug:
  stage: lint
  image: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/target/docker-base/phpbase/8:latest
  tags:
    - php8
  script:
    - |
      bash << 'EOF'
      set -e

      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      NC='\033[0m'

      echo -e "${YELLOW}🔍 檢查 debug 函式禁用規則（dd、dump、var_dump、ray）...${NC}"
      echo ""

      # 掃描 app/ 與 routes/ 下所有 PHP 檔案
      # 排除 app/Console/Commands/Test/ 與純註解行（// /* * #）
      VIOLATIONS=$(grep -rn --include="*.php" --exclude="Debug*.php" --exclude="*example*.php" --exclude-dir="Test" \
        -E "\b(dd|dump|var_dump|ray)\s*\(" \
        app/ routes/ 2>/dev/null | \
        grep -vE ":[0-9]+:[[:space:]]*(\/\/|\/\*|\*|#)" || true)

      if [ -n "$VIOLATIONS" ]; then
        echo -e "${RED}❌ 發現 debug 函式殘留，請註解或移除：${NC}"
        echo ""
        echo "$VIOLATIONS"
        echo ""
        echo -e "${RED}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
        echo -e "${RED}  禁止將 dd() / dump() / var_dump() / ray() 推上分支  ${NC}"
        echo -e "${RED}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
        exit 1
      fi

      echo -e "${GREEN}✅ debug 函式禁用規則檢查通過${NC}"
      EOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
  allow_failure: false

lint:no-hardcode:
  stage: lint
  image: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/target/docker-base/phpbase/8:latest
  tags:
    - php8
  variables:
    GIT_DEPTH: "0" # merge-base 需完整歷史
  script:
    - |
      bash << 'EOF'
      set -e

      # ratchet 閘：只掃 MR 新增行（存量 158 筆另行排消，不在此擋）
      # 樣態與豁免規則見 .githooks/check-hardcode.sh（pre-commit 與 CI 共用同一份）
      git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" 2>/dev/null || true
      BASE=$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD 2>/dev/null || echo "$CI_MERGE_REQUEST_DIFF_BASE_SHA")

      bash .githooks/check-hardcode.sh --range "${BASE}...HEAD"
      EOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

lint:strict-types:
  stage: lint
  image: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/target/docker-base/phpbase/8:latest
  tags:
    - php8
  script:
    - |
      VIOLATIONS=$(grep -rL "declare(strict_types=1)" app/ --include="*.php" 2>/dev/null | \
        grep -v "app/Http/Controllers/External/SingleWallets" | \
        grep -v "app/Http/Controllers/External/TransferWallets" || true)

      if [ -n "$VIOLATIONS" ]; then
        echo "❌ 以下檔案缺少 declare(strict_types=1)："
        echo ""
        echo "$VIOLATIONS"
        echo ""
        COUNT=$(echo "$VIOLATIONS" | wc -l | tr -d ' ')
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  共 ${COUNT} 個檔案缺少 declare(strict_types=1)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        exit 1
      fi

      echo "✅ strict_types 規則檢查通過"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
  allow_failure: true

lint:no-bom:
  stage: lint
  image: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/target/docker-base/phpbase/8:latest
  tags:
    - php8
  script:
    - |
      # 全庫零容忍（本專案目前無任何帶 BOM 的檔案）。
      # 邏輯與 pre-commit 共用 .githooks/check-bom.sh，改規則只需改一處。
      bash .githooks/check-bom.sh --all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
  allow_failure: false

lint:no-bc-functions:
  stage: lint
  image: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/target/docker-base/phpbase/8:latest
  tags:
    - php8
  script:
    - |
      bash << 'EOF'
      set -e

      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      NC='\033[0m'

      echo -e "${YELLOW}🔍 檢查 bc 函式禁用規則（金額運算一律走 Common::num*）...${NC}"
      echo ""

      # 全庫零容忍：存量已於本規則上線時清零（19 處 / 7 檔）。
      # 唯一合法呼叫點是 MathTrait —— Common::num* 系列的實作本體。
      # 直呼 bc 函式會繞過 MathTrait 的字串正規化與 scale 預設，
      # 且 scale 漏帶時 bc 預設為 0（整數截斷），金額會靜默算錯。
      #
      # 清單含 PHP 8.4 新增的 bcround／bcfloor／bcceil／bcdivmod／bcpowmod（容器 8.4.25 實測全部存在）。
      # bcround／bcfloor 尤其危險：它們正是有人「簡化」手寫 round half-up 時最可能改用的函式。
      # grep 用 -i：PHP 函式名不分大小寫，BCAdd( 執行完全等價；而 pint.json 排除了
      # SingleWallets／TransferWallets 兩個動錢目錄，native casing 正規化在最需要的地方不生效。
      # MathTrait 的排除錨定在行首路徑，避免同行寫該檔名的註解即可繞過。
      # 確有必要直呼（bcpow／bcsqrt／bcmod／bcscale 目前無 Common:: 對應方法）時，
      # 於該行加上 lint:allow-bc 註解並寫明理由。
      VIOLATIONS=$(grep -rni --include="*.php" \
        -E "\b(bcadd|bcsub|bcmul|bcdiv|bccomp|bcpow|bcsqrt|bcmod|bcscale|bcround|bcfloor|bcceil|bcdivmod|bcpowmod)\s*\(" \
        app/ routes/ 2>/dev/null | \
        grep -v "^app/Helpers/Traits/MathTrait\.php:" | \
        grep -v "lint:allow-bc" | \
        grep -vE ":[0-9]+:[[:space:]]*(\/\/|\/\*|\*|#)" || true)

      if [ -n "$VIOLATIONS" ]; then
        echo -e "${RED}❌ 發現直接呼叫 bc 函式（應改用 Common::num* 並顯式帶 scale）：${NC}"
        echo ""
        echo "$VIOLATIONS"
        echo ""
        echo -e "${RED}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
        echo -e "${RED}  bcadd→numAdd／bcsub→numSub／bcmul→numMul  ${NC}"
        echo -e "${RED}  bcdiv→numDiv／bccomp→numCompare，scale 逐處保留  ${NC}"
        echo -e "${RED}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${NC}"
        exit 1
      fi

      echo -e "${GREEN}✅ bc 函式禁用規則檢查通過${NC}"
      EOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
  allow_failure: false

