stages:
  - prepare

# 測試自 prepare 拆出為獨立 job 的理由：
#   1. GitLab 的橫向分片（parallel:）是 job 級能力，測試綁在 prepare 內就永遠切不開
#   2. lint 類檢查數秒即可失敗，不該與最慢的測試綁在同一個判定裡
#   3. retry 粒度：測試 flaky 想重跑時，不必連 pint / PHPMD / dump-autoload 一起重來
#   4. 消除 prepare 內 composer dump-autoload 與 artisan test 併發競爭 vendor/autoload 的隱患
#
# 本 job 與 prepare 同屬 prepare stage、彼此無 needs 關係，故兩者並行：
#   - 資料庫相關工作（建庫、migrate:fresh、SyncProcedureSeeder、mysqldump 產 init.sql）
#     全數集中在本 job，prepare 完全不碰 DB，因此不存在重複 migration 的成本
#   - prepare 的 pint / PHPMD 失敗不會擋掉測試結果，兩邊訊號同時取得
#   - 兩者只在 composer.lock 變動（cache miss）時會各自 composer install 一次
#
# 並行測試的資料庫策略（Illuminate\Testing\Concerns\TestDatabases）：
#   paratest 每個 process 帶 TEST_TOKEN=[REDACTED] 於 setUpTestCase 將預設連線切到
#   `{DB_DATABASE}_test_{TOKEN}`；本專案 TestCase 全域 use DatabaseTransactions，該 trait 在
#   $databaseTraits 清單內，故切換會生效，且會對每個 process 呼叫一次 Artisan::call('migrate')。
#   若放任 Laravel 自行建庫，等同每個 process 從零跑完整 migration，且不會執行 SyncProcedureSeeder
#   （stored procedure 與 procedure_hashes 缺失 → ensureStoredProcedureExists() 相關測試必紅）。
#   因此改由本 job 預先建立 N 個 test DB 並逐一灌入 init.sql（mysqldump --routines，含 routines
#   與 migrations 表），Laravel 端的 migrate 便成為 no-op。
test:
  stage: prepare
  image: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/target/docker-base/phpbase/8-minimal:ae4fd248
  tags:
    - php8
  needs:
    # 只依賴 MIGRATION_HASH（dotenv），供 init_sql_cache 的 key 與 dump 是否過期的判定使用；
    # 不依賴 prepare，兩者並行
    - job: calculate_migration_hash
      artifacts: true
  extends:
    - .default_cache
    - .default_variables
    - .default_service
    - .php_memory_variable
  variables:
    # paratest 進程數。同時決定要預建幾個 test DB，兩者必須一致。
    # 太高會撞 MySQL 連線數與 runner CPU，先固定 4；依 job log 印出的 CPU 配額（cgroup quota，不是 nproc）與耗時再調。
    TEST_PROCESSES: "4"
    # 向 k8s 預留的 CPU（request，不是上限；pod 仍可用滿節點）。用途是讓排程器不把兩個 test job
    # 塞進同一台 6 核節點互搶 CPU 與 I/O：一個 job 預留 build 3 ＋ mysql、redis 各 0.5（service 值會
    # 套到每個 service 容器）＝ 4 核，兩個 job 合計 8 核放不進同一台。
    # 不能再加：4 ＋ 1 ＋ 1 加上 helper 超過節點可分配的 CPU，pod 會卡在 Pending「Insufficient cpu」
    # 直到逾時（job 360108）。上限另由 runner 的 cpu_request_overwrite_max_allowed（4）與
    # service_cpu_request_overwrite_max_allowed（2）決定。
    KUBERNETES_CPU_REQUEST: "3"
    KUBERNETES_SERVICE_CPU_REQUEST: "0.5"
    # 測試庫的 AUTO_INCREMENT 起點。
    #   程式碼裡有以 id 大小表達語意的門檻，例如 cash_flows.id <= 62 視為舊系統（CashFlowScopeEnum）、
    #   agents.id = 1 視為 admin（VendorService 的 hierarchy 過濾）。舊的單一測試庫是靠全部 3000+ 測試
    #   共用同一份自增序列、跑到後段時自增值早已越過這些門檻，才「剛好」都對；並行後每個 process 各自
    #   一份乾淨的庫、只跑約四分之一測試，id 從 1 起算就會踩進門檻，造成序列能過、並行不能過的假失敗。
    #   本機開發庫的自增值也早就是六位數，所以本機同樣看不到這類失敗。這裡直接把起點抬到門檻之上，
    #   讓 CI 的 id 分佈貼近本機與正式環境。
    TEST_DB_AUTO_INCREMENT_START: "1000"
  rules:
    # master 的 push pipeline 只是把 MR pipeline 測過的內容再測一次（MR-to-master 已在
    # before_script 以 git merge --no-ff 模擬合併結果），且 master 不觸發 build/deploy，
    # 純重複。合併後的把關改由 release tag pipeline 負責（該處 test 已 gate release-prod）。
    # tag pipeline 的 CI_PIPELINE_SOURCE 同樣是 push，靠 CI_COMMIT_BRANCH 只在 branch
    # pipeline 有值來區分，故本規則不會擋掉 release_xxx 的 tag pipeline。
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"
      when: never
    # Draft MR 的 pipeline 不自動跑 test：改動還在迭代，develop pipeline 已完整跑過一次。
    # 改成手動、不是跳過：手動 job 不允許失敗時，沒按 ▶ 的 pipeline 停在 blocked，MR 合不了。
    # 跳過的話 pipeline 會是綠燈，改回 Ready 不會自動開新 pipeline，MR 就能在沒跑 test 的情況下合併。
    # 改回 Ready 後在 MR 頁面按「Run pipeline」（新 pipeline 的 CI_MERGE_REQUEST_DRAFT 是 false，test 自動跑）或按 test 的 ▶。
    # CI_MERGE_REQUEST_DRAFT 是 GitLab 17.10 起才有的變數，沒有值時不吻合本條，test 照常自動跑。
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: manual
      allow_failure: false
    - when: always
  before_script:
    # 準備 .env.testing 和 .env
    - |
      _T0=$(date +%s)
      cp .env.testing-ci .env.testing
      cp .env.testing-ci .env
      uname -a
      # nproc 回報的是節點核數，不是這個 pod 的 CPU 配額；要調 TEST_PROCESSES 得看 cgroup 的 quota。
      # cgroup v2 看 cpu.max（"quota period"，quota=max 表示不限）；v1 看 cfs_quota_us / cfs_period_us（-1 表示不限）。
      if [ -r /sys/fs/cgroup/cpu.max ]; then
        CPU_QUOTA="cgroup v2 cpu.max=$(cat /sys/fs/cgroup/cpu.max)"
      elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
        CPU_QUOTA="cgroup v1 cfs_quota_us=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us) cfs_period_us=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
      else
        CPU_QUOTA="cgroup 讀不到"
      fi
      echo "可用核心數（nproc）：$(nproc)，CPU 配額：${CPU_QUOTA}，本次 TEST_PROCESSES=$TEST_PROCESSES"
      git config --global user.email "user@example.invalid"
      git config --global user.name "runner"
      printf '\033[1;36m[CI timing]\033[0m 準備 .env 與 git 設定 — \033[1;32m%ss\033[0m\n' "$(($(date +%s)-_T0))"
    # merge request 時執行 local merge，確保測的是合併後的內容（與 prepare 同一份邏輯）
    - |
      _T0=$(date +%s)
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "master" ]; then
        apt-get update && apt-get install -y git

        git config --global user.email "user@example.invalid"
        git config --global user.name "runner"

        echo "MR from $CI_COMMIT_REF_NAME → $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git fetch origin $CI_COMMIT_REF_NAME $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        git checkout -b merge-target origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        git merge --no-ff origin/$CI_COMMIT_REF_NAME -m "Temp merge for MR test"
      fi
      printf '\033[1;36m[CI timing]\033[0m MR merge（或略過）— \033[1;32m%ss\033[0m\n' "$(($(date +%s)-_T0))"
  script:
    # vendor 保底：正常情況由 composer.lock cache 命中 prepare 裝好的 vendor/，
    # cache 未命中或內容與 composer.lock 不符時（成因見 prepare.yml 同段註解）就地補裝
    - |
      _T0=$(date +%s)
      LOCK_HASH=$(md5sum composer.lock | awk '{print $1}')
      CACHED_HASH=$(cat vendor/.composer_lock_hash 2>/dev/null || echo "")
      if [ ! -d vendor ] || [ -z "$(ls -A vendor)" ] || [ "$LOCK_HASH" != "$CACHED_HASH" ]; then
        echo "Running composer install"
        composer config --global process-timeout 2000
        export COMPOSER_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-2G}
        php -d memory_limit=${PHP_MEMORY_LIMIT:-2G} $(which composer) install --no-progress --no-interaction --prefer-dist
        echo "$LOCK_HASH" > vendor/.composer_lock_hash
      else
        echo "Using cached vendor/"
      fi
      printf '\033[1;36m[CI timing]\033[0m composer install / vendor 快取 — \033[1;32m%ss\033[0m\n' "$(($(date +%s)-_T0))"

    # 準備 key
    - |
      _T0=$(date +%s)
      php -d memory_limit=${PHP_MEMORY_LIMIT:-2G} artisan key:generate
      printf '\033[1;36m[CI timing]\033[0m artisan key:generate — \033[1;32m%ss\033[0m\n' "$(($(date +%s)-_T0))"

    # 等待 MySQL 服務就緒
    - |
      _T0=$(date +%s)
      until mysql --ssl=0 -h mysql -P 3307 -u root -p$MYSQL_ROOT_PASSWORD -e "SELECT 1"; do
        echo "等待 MySQL 服務就緒..."
        sleep 1
      done
      printf '\033[1;36m[CI timing]\033[0m 等待 MySQL 就緒 — \033[1;32m%ss\033[0m\n' "$(($(date +%s)-_T0))"

    # 建立 base 資料庫
    #   base DB 是應用開機時的預設連線目標，也是 migrate:fresh 的作用對象
    - |
      _T0=$(date +%s)
      echo "建立 base 資料庫: $MYSQL_DATABASE"
      mysql --ssl=0 -h mysql -P 3307 -u root -p$MYSQL_ROOT_PASSWORD -e "
      CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\`;
      ALTER DATABASE \`${MYSQL_DATABASE}\`
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      "
      printf '\033[1;36m[CI timing]\033[0m 建立 base 資料庫 — \033[1;32m%ss\033[0m\n' "$(($(date +%s)-_T0))"

    # 取得 init.sql：cache 命中且 hash 未變就沿用，否則重新 migrate 後 dump
    #   本 job 是 init.sql 的唯一產出者（prepare 已不碰 DB）
    - |
      _T0=$(date +%s)
      # 使用從 calculate_migration_hash job 匯出的 MIGRATION_HASH 環境變數
      # 後綴 AUTO_INCREMENT 起點：dump 內容不只受 migration 影響，起點調整過的 dump 與舊 dump
      # 不可互換，靠這個後綴讓舊 cache 自然失效（cache key 仍是 $MIGRATION_HASH）
      DUMP_TAG="${MIGRATION_HASH}-ai${TEST_DB_AUTO_INCREMENT_START}"
      echo "Pre Migration hash: $(cat migration_hash.txt 2>/dev/null)"
      echo "Cur Migration hash: $DUMP_TAG"

      if [ ! -f init.sql ] || [ "$(cat migration_hash.txt 2>/dev/null)" != "$DUMP_TAG" ]; then
        echo "init.sql 不存在或 migration / 自增起點變更，執行 migrate:fresh"
        php -d memory_limit=${PHP_MEMORY_LIMIT:-2G} artisan migrate:fresh
        php -d memory_limit=${PHP_MEMORY_LIMIT:-2G} artisan db:seed --class=SyncProcedureSeeder

        # 抬高所有表的 AUTO_INCREMENT 起點，理由見 TEST_DB_AUTO_INCREMENT_START 的說明。
        # 在 dump 之前做，mysqldump 會把起點寫進 CREATE TABLE，各 test DB 還原即繼承，
        # 不必逐庫再跑一次 ALTER。
        mysql --ssl=0 -h mysql -P 3307 -u root -p$MYSQL_ROOT_PASSWORD -N -B -e "
        SELECT CONCAT('ALTER TABLE \`', TABLE_NAME, '\` AUTO_INCREMENT=${TEST_DB_AUTO_INCREMENT_START};')
        FROM information_schema.TABLES
        WHERE TABLE_SCHEMA = '${MYSQL_DATABASE}'
          AND TABLE_TYPE = 'BASE TABLE'
          AND AUTO_INCREMENT IS NOT NULL;
        " | mysql --ssl=0 -h mysql -P 3307 -u root -p$MYSQL_ROOT_PASSWORD $MYSQL_DATABASE

        # 備份主資料庫
        mysqldump --ssl=0 -h mysql -P 3307 -u root -p$MYSQL_ROOT_PASSWORD --routines $MYSQL_DATABASE > init.sql

        # 保存當前 hash
        echo $DUMP_TAG > migration_hash.txt
        echo "已更新 init.sql 與 migration_hash.txt"
      else
        echo "使用現有 dump，hash 未變"
      fi
      printf '\033[1;36m[CI timing]\033[0m migrate / 取用 dump — \033[1;32m%ss\033[0m\n' "$(($(date +%s)-_T0))"

    # 預建 N 個 test DB，並行灌入 init.sql
    #   - 命名須與 Laravel 的 testDatabase() 完全一致（`{DB}_test_{TOKEN}`，TOKEN 由 1 起算）
    #   - init.sql 由 `mysqldump $MYSQL_DATABASE`（不帶 --databases）產生，不含 CREATE DATABASE/USE，
    #     故可原樣灌進任一目標庫
    #   - 還原是 I/O 等待為主（785 張表的 DDL），序列灌 4 次曾佔整個 job 的 38%～43%（122s～237s）。
    #     改成 N 個 mysql client 同時灌不同庫，讓 mysqld 把等待疊起來；本機實測 4 庫由 96s 降到 57s，
    #     搭配 _service.yml 關掉 fsync 後再降到 32s。
    #   - 子程序在背景跑，`set -e` 管不到：必須逐一 `wait $pid` 收結束碼，任一非 0 就讓 job 失敗，
    #     否則某個庫沒建好會變成一整批「table doesn't exist」的假測試失敗。
    - |
      _T0=$(date +%s)
      PIDS=""
      for i in $(seq 1 "$TEST_PROCESSES"); do
        (
          TEST_DB="${MYSQL_DATABASE}_test_${i}"
          echo "建立並還原測試資料庫: $TEST_DB"
          mysql --ssl=0 -h mysql -P 3307 -u root -p$MYSQL_ROOT_PASSWORD -e "
          DROP DATABASE IF EXISTS \`${TEST_DB}\`;
          CREATE DATABASE \`${TEST_DB}\`
          CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          " && mysql --ssl=0 -h mysql -P 3307 -u root -p$MYSQL_ROOT_PASSWORD "$TEST_DB" < init.sql \
            && echo "還原完成: $TEST_DB"
        ) &
        PIDS="$PIDS $!"
      done
      RESTORE_FAILED=0
      for pid in $PIDS; do
        wait "$pid" || RESTORE_FAILED=1
      done
      printf '\033[1;36m[CI timing]\033[0m 並行建立 %s 個測試資料庫 — \033[1;32m%ss\033[0m\n' "$TEST_PROCESSES" "$(($(date +%s)-_T0))"
      if [ "$RESTORE_FAILED" -ne 0 ]; then
        echo "❌ 至少一個測試資料庫還原失敗，中止"
        exit 1
      fi

    # 並行執行測試
    #   --processes 非 artisan test 自身的選項，由 Laravel 轉傳給 paratest（-p 已被 --parallel 佔用）
    - |
      _T0=$(date +%s)
      set +e
      php artisan test --parallel --processes="$TEST_PROCESSES"
      EC_TEST=$?
      set -e
      printf '\033[1;36m[CI timing]\033[0m artisan test --parallel（%s processes）— \033[1;32m%ss\033[0m\n' "$TEST_PROCESSES" "$(($(date +%s)-_T0))"

      if [ "$EC_TEST" -ne 0 ]; then
        echo "❌ artisan test 結束碼: $EC_TEST"
        exit "$EC_TEST"
      fi
      echo "✅ artisan test passed"
