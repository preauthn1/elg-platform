steps:
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |

      docker build -f server-build/Dockerfile-php -t example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:latest .
      docker tag example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:$SHORT_SHA example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:latest
      docker push example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:latest
#- name: 'example.invalid/cloud-builders/docker'
#  args: ['build', '-f', 'server-build/Dockerfile-php', '-t', 'example.invalid/$PROJECT_ID/agent-webapi-image:$SHORT_SHA', '.']
#- name: 'example.invalid/cloud-builders/docker'
#  args: ["push", "example.invalid/$PROJECT_ID/agent-webapi-image:$SHORT_SHA"]
- name: 'example.invalid/cloud-builders/kubectl'
  args:
  - set
  - image
  - deployment
  - agent-webapi-deployment
  - agent-webapi-container=example.invalid/$PROJECT_ID/${_PHP_IMAGE_NAME}:$SHORT_SHA
  env:
  - 'CLOUDSDK_COMPUTE_ZONE=asia-east1-a'
  - 'CLOUDSDK_CONTAINER_CLUSTER=xsgcasino-cluster'
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build/Dockerfile-nginx -t example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:latest .
      docker tag example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:latest
      docker push example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:latest
#- name: 'example.invalid/cloud-builders/docker'
#  args: ['build', '-f', 'server-build/Dockerfile-nginx', '-t', 'example.invalid/$PROJECT_ID/agent-webapi-nginx-image:$SHORT_SHA', '.']
#- name: 'example.invalid/cloud-builders/docker'
#  args: ["push", "example.invalid/$PROJECT_ID/agent-webapi-nginx-image:$SHORT_SHA"]
- name: 'example.invalid/cloud-builders/kubectl'
  args:
  - set
  - image
  - deployment
  - agent-webapi-deployment
  - agent-nginx-container=example.invalid/$PROJECT_ID/${_NGINX_IMAGE_NAME}:$SHORT_SHA
  env:
  - 'CLOUDSDK_COMPUTE_ZONE=asia-east1-a'
  - 'CLOUDSDK_CONTAINER_CLUSTER=xsgcasino-cluster'
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build/Dockerfile-fluentd -t example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:latest .
      docker tag example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:latest
      docker push example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:latest
  #- name: 'example.invalid/cloud-builders/docker'
  #  args: ['build', '-f', 'server-build/Dockerfile-fluentd', '-t', 'example.invalid/$PROJECT_ID/webapi-fluentd-image:$SHORT_SHA', '.']
  #- name: 'example.invalid/cloud-builders/docker'
  #  args: ["push", "example.invalid/$PROJECT_ID/webapi-fluentd-image:$SHORT_SHA"]
- name: 'example.invalid/cloud-builders/kubectl'
  args:
    - set
    - image
    - deployment
    - agent-webapi-deployment
    - agent-fluentd-container=example.invalid/$PROJECT_ID/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA
  env:
    - 'CLOUDSDK_COMPUTE_ZONE=asia-east1-a'
    - 'CLOUDSDK_CONTAINER_CLUSTER=xsgcasino-cluster'
substitutions:
  _PHP_IMAGE_NAME: agent-webapi-image
  _NGINX_IMAGE_NAME: agent-webapi-nginx-image
  _FLUENTD_IMAGE_NAME: agent-webapi-fluentd-image