variables:
  AR_PATH: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024

stages:
  - build-docker

build-logstash:
  stage: build-docker
  tags:
    - php
  image: google/cloud-sdk:522.0.0
  variables:
    DOCKER_HOST: tcp://localhost:2375
  services:
    - name: docker:18-dind
      command: ["--mtu=1400"]
  only:
    - master
  before_script:
    - docker info
    - gcloud --version && docker --version && kubectl version --client
    - gcloud auth activate-service-account --key-file ./tp-wz3-rd-gcr-rw.json
    - docker login -u _json_key --password-stdin https://asia-east1-docker.pkg.dev < ./tp-wz3-rd-gcr-rw.json
    - docker pull ${AR_PATH}/${CI_PROJECT_PATH}/logstash:latest || true
    - curl -vv https://example.invalid/rate_limit
  script:
    - echo ${CI_COMMIT_SHA:0:8}
    - export DOCKER_BUILDKIT=1
    # pin BuildKit <= v0.30.0 (runc 1.3.5): v0.31.0+ (runc 1.3.6) mounts tmpfs with nr_inodes=1, rejected by the 4.15 node kernel
    - docker buildx create --name pinned --driver docker-container --driver-opt image=moby/buildkit:v0.30.0 --use
    # logstash
    - echo "===== Building logstash ====="
    - cd ${CI_PROJECT_DIR}/logstash
    - docker build --push -f Dockerfile -t ${AR_PATH}/${CI_PROJECT_PATH}/logstash:latest --cache-from ${AR_PATH}/${CI_PROJECT_PATH}/logstash:latest --build-arg BUILDKIT_INLINE_CACHE=1 .
    - docker pull ${AR_PATH}/${CI_PROJECT_PATH}/logstash:latest || true
    - docker tag ${AR_PATH}/${CI_PROJECT_PATH}/logstash:latest ${AR_PATH}/${CI_PROJECT_PATH}/logstash:${CI_COMMIT_SHA:0:8}
    - docker push ${AR_PATH}/${CI_PROJECT_PATH}/logstash:${CI_COMMIT_SHA:0:8}
    - docker push ${AR_PATH}/${CI_PROJECT_PATH}/logstash:latest

