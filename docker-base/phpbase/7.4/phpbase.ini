; CVE-2026-109618 / CVE-2026-109619 緩解（修補之外的第二層）
; session upload progress 已在修補版原始碼中強制關閉，這裡再明確關一次
session.upload_progress.enabled = 0

upload_max_filesize = 20M
post_max_size = 21M

; 限制請求大小與結構（只增加攻擊難度，不是完整解法）
max_input_vars = 1000
max_file_uploads = 20
max_input_nesting_level = 32
; 修補版新增的 INI，-1 = max_input_vars + max_file_uploads
max_multipart_body_parts = -1

; 修補版超過 memory_limit 會直接 _exit(1)，不會有 shutdown 或 error_log，
; 請依實際應用調整，並以 Pod resources.limits.memory 為上限
memory_limit = 256M

expose_php = Off
