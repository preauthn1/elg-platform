# 白標 metadata registry（非機密平面，可進 git）
# 機密（DB host/port/user/password）永不寫此檔——見 ../README.md 雙平面契約。
# schema：見 ../README.md 與 ../scripts/check-registry.php（結構/型別驗證，CI/pre-commit/本機同一支）。
# CI 硬閘走 ../../scripts/validate.sh §8（直接調用 check-registry.php）。
# 本檔服務 DB connection 面與白標查詢範疇（rootAgentId＝業務子樹 root agent）；
# gcp-log-troubleshoot 的白標→GCP project 對照內嵌於該 skill、各自獨立維護。
#
# 每白標 schema：
#   canonical          標準名（= key）
#   aliases[]          口語 / 拼錯別名
#   connectionId       Laravel connection 識別名
#   env                production | test
#   rootAgentId        業務子樹 root agent id（int；env=test 為 null）——查詢一律以此切 hierarchy 範疇
#   rootAgentUsername  對應 agents.username（DB 反查/顯示依據；env=test 為 null）
#   testRootAgentId    測試代理 id（int；env=test 為 null）——金流/遊戲商戶配置的測試掛點：正式環境先配此代理供驗收，正式代理後開。必直接掛在正式代理下（agents.parent==rootAgentId）
#   testRootAgentUsername 對應測試代理 agents.username（env=test 為 null）
#   sharesConnection   connectionId 是否被 ≥2 白標共用（bool；須與實況一致，checker 驗）
#   dbcPort            dbc 本機代理 port（int，取自 sre/dbc 的 instances.yaml：34xx 從庫、35xx 主庫）；
#                      null＝dbc 尚未涵蓋，mysql-mcp.js 退回容器 config / secrets.env 舊路徑。
#                      非機密：port 是公開常數、host 固定 0.0.0.0、無密碼（IAM 由 dbc 代理層完成）。
#                      同 connectionId 的白標必須同 port（checker 驗）。
#   database           該 connection 的 DB 名稱（safe-token）；非機密：dbc 的 IAM 使用者 SHOW DATABASES 即可見。
#   note               選填人類備註

