<!--
  共用報告外殼。樣式一律走 docs/reports/assets/report.css（Frest 色票的設計系統），
  ⛔ 不要內聯整套 CSS——與 payment-providers-report、payment-risk-findings 等同源。
  渲染時替換所有 {{PLACEHOLDER}}，章節 HTML 填入 {{SECTIONS}}。
  狀態徽章 class .st.sN 已涵蓋代收(0~4)與代付(0/1/2/3/4/9/21/22/24/29)所有值。
-->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://example.invalid">
<link rel="preconnect" href="https://example.invalid" crossorigin>
<link href="https://example.invalid/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/report.css">
</head>
<body>
<!-- 內文行內圖示的 symbol 集（report.css 定案的做法：symbol＋use，內聯於各報告 body 開頭）。
     用法：<svg class="ni"><use href="#i-alert"/></svg>；不足時比照 feather 風格自行增補。 -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
  <symbol id="i-crash" viewBox="0 0 24 24"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></symbol>
  <symbol id="i-bank" viewBox="0 0 24 24"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><path d="M12 2 21 7H3z"/></symbol>
</svg>
<div class="app">

  <!--
    ⛔ 全篇禁用 emoji（側欄、章節標題、內文註解、chip、節點描述一律不得出現）。
    內文行內圖示：<svg class="ni"><use href="#i-alert"/></svg>
      （symbol 集見 body 開頭；svg.ni 由 report.css 提供 14px／stroke:currentColor／primary 色）
      現成 id：i-alert／i-check／i-lock／i-cal／i-search／i-pin／i-tool／i-crash／
              i-list／i-repeat／i-flag／i-bank，不足時比照 feather 風格增補 symbol。
    圈號字元（①②③ⒶⒷⒸ）筆畫小，內文出現一律包 <span class="cn">①</span> 放大；
      節點徽章（.fn-n）內的圈號不包 .cn（徽章已是固定尺寸）。
    側欄圖示用線性 SVG（stroke=currentColor，與報告中心首頁一致），不用 emoji。
    wrapper：<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">{inner}</svg>
    {{LOGO}} 代收（money-in）：<circle cx="12" cy="12" r="9"/><path d="M12 7.5v6"/><path d="m9 10.5 3 3 3-3"/>
    {{LOGO}} 代付（money-out）：<circle cx="12" cy="12" r="9"/><path d="M12 16.5v-6"/><path d="m9 13.5 3-3 3 3"/>
    {{MENU}} 各 <span class="ic"> 內嵌：
      list（狀態值總覽）  <line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
      cycle（生命週期狀態機）<path d="M21 3v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 9"/><path d="M3 21v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 15"/>
      zap（變更時機明細）  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      bank（上分機制·代收）<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><path d="M12 2 21 7H3z"/>
      tool（舊後台審核·代付）<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  -->
  <aside class="sidebar">
    <div class="brand"><div class="logo">{{LOGO}}</div><div class="name">{{BRAND}}</div></div>
    <div class="menu-label">報告章節</div>
    <ul class="menu">
      {{MENU}}
    </ul>
    <div class="foot">{{FOOT_SOURCE}}<br>· {{DATE}} ·</div>
  </aside>

  <div class="content">
    <div class="topbar">
      <div>
        <div class="crumb">{{CRUMB}}</div>
        <h1>{{H1}}</h1>
      </div>
      <div class="chips">{{CHIPS}}</div>
    </div>

    <div class="container">
      <div class="stats">{{STATS}}</div>

      {{SECTIONS}}

      <p style="text-align:center; color:var(--faint); font-size:12px; margin:34px 0 10px">
        {{FOOTER_NOTE}}
      </p>
    </div>
  </div>
</div>

<script>
  const links=[...document.querySelectorAll('.menu a')];
  const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  const obs=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.classList.remove('active')); map.get(e.target.id)?.classList.add('active'); }});
  },{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('section[id]').forEach(s=>obs.observe(s));
</script>
</body>
</html>
