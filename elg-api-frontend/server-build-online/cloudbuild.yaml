steps:
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build-online/Dockerfile-php -t example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:latest .
      docker tag example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:$SHORT_SHA example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:latest
      docker push example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:latest
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build-online/Dockerfile-nginx -t example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest .
      docker tag example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest
      docker push example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build-online/Dockerfile-fluentd -t example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:latest .
      docker tag example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:latest
      docker push example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:latest
- name: 'example.invalid/cloud-builders/kubectl'
  args:
    - set
    - image
    - deployment
    - webapi-deployment
    - webapi-container=example.invalid/${_PROJECT_ID}/${_PHP_IMAGE_NAME}:$SHORT_SHA
  env:
    - 'CLOUDSDK_CORE_PROJECT=tp-wz3-online'
    - 'CLOUDSDK_COMPUTE_ZONE=asia-southeast1-a'
    - 'CLOUDSDK_CONTAINER_CLUSTER=xsgcasino-cluster'
- name: 'example.invalid/cloud-builders/kubectl'
  args:
    - set
    - image
    - deployment
    - webapi-deployment
    - nginx-container=example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA
  env:
    - 'CLOUDSDK_CORE_PROJECT=tp-wz3-online'
    - 'CLOUDSDK_COMPUTE_ZONE=asia-southeast1-a'
    - 'CLOUDSDK_CONTAINER_CLUSTER=xsgcasino-cluster'
- name: 'example.invalid/cloud-builders/kubectl'
  args:
    - set
    - image
    - deployment
    - webapi-deployment
    - fluentd-container=example.invalid/${_PROJECT_ID}/${_FLUENTD_IMAGE_NAME}:$SHORT_SHA
  env:
    - 'CLOUDSDK_CORE_PROJECT=tp-wz3-online'
    - 'CLOUDSDK_COMPUTE_ZONE=asia-southeast1-a'
    - 'CLOUDSDK_CONTAINER_CLUSTER=xsgcasino-cluster'
substitutions:
  _PROJECT_ID: tp-wz3-online
  _PHP_IMAGE_NAME: webapi-image
  _NGINX_IMAGE_NAME: webapi-nginx-image
  _FLUENTD_IMAGE_NAME: webapi-fluentd-image