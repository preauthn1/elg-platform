apiVersion: v1
kind: Service
metadata:
  name: webapi-service2
  annotations:
    example.invalid/backend-config: '{"ports": {"webapi-port":"socket-backend-config"}}'
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: socket-port
    port: 6001
    targetPort: 6001
  selector:
    app: webapi
  type: NodePort