steps:
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build-dsg/Dockerfile-php -t example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:latest .
      docker tag example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:$SHORT_SHA example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:latest
      docker push example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:latest
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest || exit 0
- name: 'example.invalid/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build -f server-build-dsg/Dockerfile-nginx -t example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA --cache-from example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest .
      docker tag example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest
      docker push example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA
      docker push example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:latest
- name: 'bitnami/kubectl:latest'
  args:
    - set
    - image
    - deployment
    - webapi-deployment
    - webapi-container=example.invalid/${_PROJECT_ID}/${_NAMESPACE}/${_PHP_IMAGE_NAME}:$SHORT_SHA
  env:
    - 'KUBECONFIG=/workspace/server-build-dsg/.kube/config'
- name: 'bitnami/kubectl:latest'
  args:
    - set
    - image
    - deployment
    - webapi-deployment
    - nginx-container=example.invalid/${_PROJECT_ID}/${_NGINX_IMAGE_NAME}:$SHORT_SHA
  env:
    - 'KUBECONFIG=/workspace/server-build-dsg/.kube/config'
substitutions:
  _PROJECT_ID: tp-wz3-online
  _NAMESPACE: dsg
  _PHP_IMAGE_NAME: webapi-image
  _NGINX_IMAGE_NAME: webapi-nginx-image
  _FLUENTD_IMAGE_NAME: webapi-fluentd-image