apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi-deployment
spec:
  selector:
    matchLabels:
      app: webapi
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: webapi
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: shared-files
          emptyDir: {}
      containers:
        - name: nginx-container
          image: "example.invalid/tp-wz3-online/webapi-nginx-image:646db1d"
          ports:
            - containerPort: 80
            - containerPort: 6001
          resources:
            limits:
              memory: 600Mi
            requests:
              cpu: 300m
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
          lifecycle: # graceful stop
            preStop:
              exec:
                command: ["/bin/bash","-c","/bin/sleep 1; /usr/sbin/nginx -s quit"]
        - name: fluentd-container
          image: "example.invalid/tp-wz3-online/webapi-fluentd-image:646db1d"
          resources:
            limits:
              memory: 600Mi
            requests:
              cpu: 300m
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
        - name: webapi-container
          image: "example.invalid/tp-wz3-online/webapi-image:646db1d"
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
          resources:
            limits:
              memory: 600Mi
            requests:
              cpu: 300m
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp -r /app/. /var/www/html; cd /var/www/html; php artisan migrate; chmod -R 777 storage"]
            preStop:
              exec:
                command: ["/bin/bash","-c","/bin/sleep 30; kill -QUIT 1"] # 等 php-fpm process_control_timeout  改成 30 只需要sleep 1 秒