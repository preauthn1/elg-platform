version: '3.4'

services:
  code-server:
    build: ./svcs/code-server
    environment:
      - PASSWORD=[REDACTED]
    volumes:
      - ./data/html:/home/coder/workspace
      - ~/.ssh:/root/.ssh
    ports:
      - "8080:8080"
    networks:
      - external
    # depends_on:
  redis:
    image: redis:latest
    restart: always
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      - MYSQL_ROOT_PASSWORD=[REDACTED]
      - MYSQL_ROOT_HOST=%
    volumes:
        - "./svcs/mysql/my.cnf:/etc/my.cnf"
        - "./data/var-lib-mysql:/var/lib/mysql"
    ports:
      - "3306:3306"
  nginx:
    extends:
      file: ./data/docker-compose.aliases.yaml
      service: nginx
    image: nginx:1.23
    ports:
      - "80:80"
    links:
      - phpfpm
    volumes:
      - "./svcs/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./svcs/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "./data/nginx/sites-enabled:/etc/nginx/sites-enabled"
      - "./data/html:/var/www/html"
      - "./data/log/nginx:/var/log/nginx"
    restart: always