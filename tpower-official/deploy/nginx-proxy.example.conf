# TPOWER 官方站：Cloudflare 後方既有 nginx container 的反向代理範例。
# 公開網址：newofficial.tpower.game、www.tpower.game、tpower.game 都直接提供內容。
# Cloudflare 負責訪客端 HTTPS，origin 只監聽 HTTP 80，不做域名間轉址。
# Cloudflare SSL/TLS mode 必須允許以 HTTP 連到 origin（Flexible）。
#
# 使用方式：
#   1. nginx 與 tpower-official 加入同一個 Docker network。
#   2. 將本檔掛載到 /etc/nginx/conf.d/tpower.conf:ro。
#   3. nginx -t 成功後執行 nginx -s reload。
#
# Compose 重建 tpower-official 後 container IP 可能改變；部署流程應在 app healthy 後
# reload nginx，讓 upstream 重新解析 Docker DNS。

proxy_cache_path /var/cache/nginx/official-tpower levels=1:2 keys_zone=tpower:10m
                 inactive=1h max_size=256m use_temp_path=off;

upstream tpower_official {
    server tpower-official:3000;
    keepalive 16;
}

# Cloudflare 會覆寫 X-Forwarded-Proto；只接受 http/https，避免任意值傳入 Express。
map $http_x_forwarded_proto $tpower_forwarded_proto {
    default http;
    http    http;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name newofficial.tpower.game www.tpower.game tpower.game;

    charset utf-8;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    location ~ /\. {
        deny all;
    }

    location ~* \.json$ {
        return 404;
    }

    location ^~ /content/ {
        return 404;
    }

    location = /content {
        return 404;
    }

    location = /healthz {
        proxy_pass http://tpower_official;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $tpower_forwarded_proto;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    location /admin {
        proxy_pass http://tpower_official;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $tpower_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://tpower_official;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $tpower_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Node 直接供應靜態檔；nginx container 不需要掛載專案或 uploads 目錄。
    location /assets/ {
        proxy_pass http://tpower_official;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $tpower_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://tpower_official;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $tpower_forwarded_proto;
    }

    location / {
        proxy_pass http://tpower_official;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $tpower_forwarded_proto;
        proxy_read_timeout 60s;

        proxy_cache tpower;
        proxy_cache_key "$tpower_forwarded_proto$host$uri";
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout invalid_header updating
                              http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        # location 內使用 add_header 後不會繼承 server 層設定，因此需重新列出。
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
