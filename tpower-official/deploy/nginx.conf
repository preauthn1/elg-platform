# TPOWER 官方形象站 —— nginx 設定
#   公開頁：反向代理給 Node（即時渲染），nginx 這一層做 proxy_cache
#   /assets 與 /uploads：直接供檔，不經過 Node
#   後台與 API：反向代理給 Node，不快取
#
# 安裝：
#   cp deploy/nginx.conf /etc/nginx/sites-available/official-tpower
#   ln -s /etc/nginx/sites-available/official-tpower /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx


# 公開頁的 proxy_cache。這一層是刻意留的 —— 公開頁改成即時渲染後 Node 進了關鍵路徑，
# 有它才有 proxy_cache_use_stale：Node 重啟或掛掉的那幾秒，訪客拿到的是快取裡
# 稍舊的頁面，不是 502。Node 自己也有一層記憶體頁面快取，兩層是獨立的。
#   inactive=1h  一小時沒人要的頁面就淘汰
#   max_size=256m  92 頁的量級遠遠用不到，這是上限保險
proxy_cache_path /var/cache/nginx/official-tpower levels=1:2 keys_zone=tpower:10m
                 inactive=1h max_size=256m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name www.tpower.game tpower.game;
    return 301 https://www.tpower.game$request_uri;
}

# 註：nginx 1.25+ 會警告 `listen ... http2` 已棄用，建議改成獨立的 `http2 on;`。
# 這裡還是用舊寫法 —— `http2 on;` 要 1.25.1 以上才有，Debian 12（1.22）與
# Ubuntu 24.04（1.24）都吃不下。等機器上的 nginx 過了 1.25 再換，警告不影響運作。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tpower.game;
    ssl_certificate     /etc/letsencrypt/live/tpower.game/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tpower.game/privkey.pem;
    # 單一正式網域：canonical 與 hreflang 都寫 www，裸網域一律導過去
    return 301 https://www.tpower.game$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tpower.game;

    ssl_certificate     /etc/letsencrypt/live/tpower.game/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tpower.game/privkey.pem;

    # 只有 /assets/ 與 /uploads/ 會用到 root（實體檔案）；公開頁走 proxy_pass。
    root /srv/official-tpower;

    charset utf-8;
    client_max_body_size 10m;   # 後台上傳上限 8MB，留一點 multipart 額外空間

    # ⚠ nginx 的 add_header 不是累加的：只要某個 location 寫了任何一個 add_header，
    #   上層的 add_header 就全部不繼承。所以下面每個要設 Cache-Control 的 location，
    #   都得把這三行安全標頭原樣再寫一次 —— 少寫等於那條路徑沒有安全標頭。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # ⚠ gzip_proxied 預設是 off，代表「代理過來的回應不壓縮」。公開頁全部是
    #   proxy_pass 來的，少了這一行整站 HTML 都不會壓縮（首頁約 40KB → 8KB）。
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # 任何 dotfile 都不對外
    location ~ /\. { deny all; }

    # ⚠ 任何 .json 與整個 content/ 都永遠不對外。
    #   system.json 有後台帳號的密碼雜湊，content.json 是站方的全部內容。
    #   /assets/ 與 /uploads/ 底下沒有任何 .json，所以這條不會擋掉正常資源；
    #   /api/ 回的是 JSON 內容但路徑不以 .json 結尾，不受影響。
    #   目前只有 /assets/ 與 /uploads/ 從磁碟供檔，這幾條照理走不到，
    #   留著是防「以後有人加了 try_files 或 autoindex」。
    #   回 404 不回 403（403 等於承認東西在）。
    location ~* \.json$    { return 404; }
    location ^~ /content/  { return 404; }
    location = /content    { return 404; }

    # ---- 後台：一律不快取 ----
    location /admin {
        proxy_pass http://0.0.0.0:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 上傳 8MB 圖要過 sharp 轉檔，別在中途斷線
    }

    # ---- API：/api/stats 是公開的跳動數字（Node 內部快取 1 小時），/api/admin/* 是後台 ----
    location /api/ {
        proxy_pass http://0.0.0.0:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- 靜態資產：從磁碟直接供檔，不經過 Node ----
    # 網址帶版號（/assets/css/site.css?v=a1b2c3d4，見 server/lib/assets.js），
    # 改版即換網址，所以放到一年 + immutable —— immutable 讓瀏覽器連 F5 都不重新驗證。
    # ⚠ 要跟 server/index.js 的 express.static 對齊。
    location /assets/ {
        alias /srv/official-tpower/assets/tpower/;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # 上傳的圖檔名帶內容 hash（img-<sha1>.webp），換圖即換網址，可以放長。
    # 例外是固定檔名的 /uploads/logo.webp —— 換 logo 後訪客最慢一小時換到新的。
    location /uploads/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- 公開頁 + robots.txt + sitemap.xml：Node 即時渲染，這一層做 proxy_cache ----
    # 404 也由 Node 回（帶正確的狀態碼與該語系的 404 頁），所以沒有 error_page 設定。
    location / {
        proxy_pass http://0.0.0.0:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_cache tpower;
        # 刻意不把 $args 放進 key：公開頁沒有一頁的內容會隨 query 改變，放進去只會讓
        # ?utm_source=... 這種追蹤參數把同一頁存成無數份（也就給了掃站的機器人一個
        # 灌爆快取的方法）。哪天真有頁面要吃 query，記得把 $is_args$args 加回來。
        proxy_cache_key "$scheme$host$uri";
        # 實際 TTL 以 Node 回的 s-maxage 為準（見 server/index.js 的 sendPage），
        # 這行只是回應沒帶快取標頭時的保險
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;              # 同一頁同時 miss，只讓一個請求穿到 Node
        proxy_cache_background_update on; # 過期後先送舊的，背景去更新
        # 這是把「Node 掛掉官網就掛掉」壓到最低的那一行 ——
        # Node 不在／超時／回 5xx 時送快取裡的舊頁面，而不是錯誤頁。
        proxy_cache_use_stale error timeout invalid_header updating
                              http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        # ⚠ 不要在這裡 add_header Cache-Control —— Node 已經回了一個，
        #   add_header 是「附加」不是「覆蓋」，會變成兩個 Cache-Control 標頭。
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
