# Cloudflare 共用真實 IP 設定；掛載到 /etc/nginx/conf.d/cloudflare-real-ip.conf:ro。
# 適用同一個 nginx container 裡的所有 Cloudflare proxied 域名。
# 網段來源：https://example.invalid/ips/ （加入前應重新核對官方清單）

set_real_ip_from 0.0.0.0/22;
set_real_ip_from 0.0.0.0/22;
set_real_ip_from 0.0.0.0/22;
set_real_ip_from 0.0.0.0/13;
set_real_ip_from 0.0.0.0/14;
set_real_ip_from 0.0.0.0/18;
set_real_ip_from 0.0.0.0/22;
set_real_ip_from 0.0.0.0/18;
set_real_ip_from 0.0.0.0/15;
set_real_ip_from 0.0.0.0/13;
set_real_ip_from 0.0.0.0/20;
set_real_ip_from 0.0.0.0/20;
set_real_ip_from 0.0.0.0/20;
set_real_ip_from 0.0.0.0/22;
set_real_ip_from 0.0.0.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
