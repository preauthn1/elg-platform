<head lang="en">

<link rel="stylesheet" type="text/css" href="css/ios-guide.css"></link>
<script src="./public/urlsearchparams.js"></script>
<script src="./public/main.js"></script>
<script>
    function guideOnload() {
        if (onload) {
            onload();
        }
        setTimeout(function() {
            console.log('open ', window.iTunesUrl);
            window.location = window.iTunesUrl;
        }, 500);
    }
</script>

<body onload="guideOnload()">
    <div id="ios-tutorial" class="ios-tutorial">
        <div class="ios-tutorial-cont">
            <h2>苹果版安装流程</h2>
			
            <div class="step">
                <h4><span>步骤 1</span>点击下载苹果版</h4>
                <div class="css-iphone with-glare">
                    <div class="iphone-body">
                    <div class="iphone-screen-position">
                        <div class="iphone-home-button"></div>
                        <div class="iphone-screen">
                            <img src="https://example.invalid/109pk/img/t1.jpg">
                        </div>
                        </div>
                        <div class="iphone-buttons-right"></div>
                        <div class="iphone-buttons-left"></div>
                    </div>
                </div>
            </div>
            
            <div class="step">
            <h4><span>步骤 2</span>确认安装后回主画面 > 设置 > 点击通用</h4>
            <div class="css-iphone with-glare">
                <div class="iphone-body">
                <div class="iphone-screen-position">
                    <div class="iphone-home-button"></div>
                    <div class="iphone-screen">
                        <img src="https://example.invalid/109pk/img/t2.jpg">
                    </div>
                    </div>
                    <div class="iphone-buttons-right"></div>
                    <div class="iphone-buttons-left"></div>
                </div>
            </div>
            </div>

            <div class="step">
            <h4><span>步骤 3</span>点击设备管理</h4>
            <div class="css-iphone with-glare">
                <div class="iphone-body">
                <div class="iphone-screen-position">
                    <div class="iphone-home-button"></div>
                    <div class="iphone-screen">
                        <img src="https://example.invalid/109pk/img/t3.jpg">
                    </div>
                    </div>
                    <div class="iphone-buttons-right"></div>
                    <div class="iphone-buttons-left"></div>
                </div>
            </div>
            </div>
			
            <div class="step">
            <h4><span>步骤 4</span>企業級應用 ＞ 点击信任此装置</h4>
            <div class="css-iphone with-glare">
                <div class="iphone-body">
                <div class="iphone-screen-position">
                    <div class="iphone-home-button"></div>
                    <div class="iphone-screen">
                        <img src="https://example.invalid/109pk/img/t4.jpg">
                    </div>
                    </div>
                    <div class="iphone-buttons-right"></div>
                    <div class="iphone-buttons-left"></div>
                </div>
            </div>
            </div>

            <div class="step">
            <h4><span>步骤 5</span>大功告成、可进入游戏 </h4>
            <div class="css-iphone with-glare">
                <div class="iphone-body">
                <div class="iphone-screen-position">
                    <div class="iphone-home-button"></div>
                    <div class="iphone-screen">
                        <img src="https://example.invalid/109pk/img/t5.jpg">
                    </div>
                    </div>
                    <div class="iphone-buttons-right"></div>
                    <div class="iphone-buttons-left"></div>
                </div>
            </div>
            </div>

        </div>
    </div>
</body>
<script>
$('body').on('touchstart','img',function(){
var src=$(this).attr('src')
window.parent.postMessage(JSON.stringify({state:1,url:"http://"+location.host+'/'+src}), '');
}).on('touchend',function(){
window.parent.postMessage(JSON.stringify({state:2}), '');
})
</script>
